name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --all-packages --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # Typecheck BLOCCANTE sugli src (mantenuti a zero errori).
      # I test sono esclusi dal typecheck per pragmatismo.
      - name: Typecheck
        run: uv run mypy apps/api/src services/ingestion/src services/indexer/src services/rag-core/src
      # Test BLOCCANTI: un test rosso deve far fallire la pipeline.
      - name: Test
        run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build
