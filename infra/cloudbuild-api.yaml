# Build dell'immagine API (Dockerfile in apps/api, contesto = root del monorepo).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/caucus-prod-gral/caucus-docker/api:latest
