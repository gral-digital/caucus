name: avvocato

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: avvocato-postgres
    environment:
      POSTGRES_USER: avvocato
      POSTGRES_PASSWORD: avvocato
      POSTGRES_DB: avvocato
      POSTGRES_INITDB_ARGS: "--locale=it_IT.UTF-8 --lc-collate=it_IT.UTF-8 --lc-ctype=it_IT.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avvocato -d avvocato"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: avvocato-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: local-dev-key
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avvocato-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Langfuse (self-hosted LLM observability)
  # Richiede il suo Postgres dedicato per tenere separati i dati operativi
  langfuse-db:
    image: postgres:16-alpine
    container_name: avvocato-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: avvocato-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: dev-change-me-langfuse-nextauth
      SALT: dev-change-me-langfuse-salt
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

  # MinIO: emula GCS localmente per sviluppo (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: avvocato-minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: avvocato
      MINIO_ROOT_PASSWORD: avvocato-dev-minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  qdrant_data:
  redis_data:
  langfuse_db_data:
  minio_data:
