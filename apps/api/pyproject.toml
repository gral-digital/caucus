[project]
name = "avvocato-api"
version = "0.0.1"
description = "FastAPI backend per Avvocato"
requires-python = ">=3.12"
dependencies = [
    "avvocato-rag-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "starlette>=0.41",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "redis>=5.2",
    "dramatiq[redis]>=1.17",
    "structlog>=24.4",
    "orjson>=3.10",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avvocato_api"]
