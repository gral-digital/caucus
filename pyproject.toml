[project]
name = "avvocato"
version = "0.0.1"
description = "Piattaforma AI enterprise per il settore legale italiano"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
# Toolchain condivisa: la CI esegue `uv run ruff|mypy|pytest`, che senza
# queste dipendenze fallirebbe con "Failed to spawn".
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "services/ingestion",
    "services/indexer",
    "services/rag-core",
]

[tool.uv.sources]
avvocato-rag-core = { workspace = true }
avvocato-ingestion = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "volumes", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # flake8-bugbear
    "A",              # flake8-builtins
    "C4",             # flake8-comprehensions
    "PIE",            # flake8-pie
    "SIM",            # flake8-simplify
    "ARG",            # unused args
    "PTH",            # pathlib
    "RUF",            # ruff-specific
]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.lint.per-file-ignores]
# FastAPI: Depends() nei default degli argomenti è l'idioma standard.
"apps/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "avvocato_api",
    "avvocato_ingestion",
    "avvocato_indexer",
    "avvocato_rag_core",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
testpaths = ["apps/api/tests", "services/*/tests"]
