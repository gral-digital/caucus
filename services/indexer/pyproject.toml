[project]
name = "caucus-indexer"
version = "0.0.1"
description = "Worker per re-indexing e re-embedding."
requires-python = ">=3.12"
dependencies = [
    "caucus-rag-core",
    "caucus-ingestion",
    "dramatiq[redis]>=1.17",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caucus_indexer"]
