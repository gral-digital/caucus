[project]
name = "avvocato-rag-core"
version = "0.0.1"
description = "Core RAG library per Avvocato: retrieval, reranking, LLM routing, schema normativa italiana."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "qdrant-client>=1.12",
    "tenacity>=9.0",
    "structlog>=24.4",
    "orjson>=3.10",
    "litellm>=1.53",
    "langfuse>=2.56",
]

[project.optional-dependencies]
embeddings-local = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
reranker-local = [
    "FlagEmbedding>=1.3",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avvocato_rag_core"]
