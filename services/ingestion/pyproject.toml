[project]
name = "caucus-ingestion"
version = "0.0.1"
description = "Pipeline ingestion normative italiane (Normattiva, Cassazione)."
requires-python = ">=3.12"
dependencies = [
    "caucus-rag-core",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "truststore>=0.10",
    "aiolimiter>=1.2",
    "orjson>=3.10",
]

[project.optional-dependencies]
pdf = [
    "docling>=2.8",
]

[project.scripts]
caucus-ingest = "caucus_ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caucus_ingestion"]
